name: CI FUSION-HP

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md

jobs:
  # ===========================================================================
  # Job 1: Build dual x86 + x64 del núcleo C++17 (MSVC, CRT estática /MT)
  # ===========================================================================
  nucleo:
    name: Núcleo C++17 dual
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arquitectura: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arquitectura }}

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.28.x'

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg
            $VCPKG_ROOT
          key: vcpkg-${{ matrix.arquitectura }}-${{ hashFiles('src/core/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-${{ matrix.arquitectura }}-

      - name: Configurar CMake (núcleo)
        working-directory: src/core
        run: |
          cmake -S . -B build-${{ matrix.arquitectura }} `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arquitectura }} `
            -DFUSION_STATIC_CRT=ON `
            -DFUSION_BUILD_TESTS=ON

      - name: Compilar núcleo
        working-directory: src/core
        run: cmake --build build-${{ matrix.arquitectura }} --config Release --parallel

      - name: Tests nativos
        working-directory: src/core/build-${{ matrix.arquitectura }}
        run: |
          .\fusion_tests.exe --reporters=console --no-breaks --no-colors

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-${{ matrix.arquitectura }}
          path: |
            src/core/build-${{ matrix.arquitectura }}/bin/*
          retention-days: 14

  # ===========================================================================
  # Job 2: Build dual target net35 + net48 de la capa gestionada
  # ===========================================================================
  gestionada:
    name: Capa gestionada C# net48
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET Framework 3.5 (reference assemblies)
        run: |
          # Habilitar feature .NET 3.5 de Windows
          dism /online /enable-feature /featurename:NetFx3 /all /norestart || true
          # Instalar Microsoft .NET Framework 3.5 Developer Pack (reference assemblies)
          choco install -y netfx-3.5-devpack --ignore-dependencies || true

      - name: Verificar reference assemblies
        run: |
          Write-Host "Reference assemblies 3.5:"
          if (Test-Path "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v3.5") {
            Write-Host "  OK 3.5 (full)"
          } else {
            Write-Host "  NO HAY 3.5 — el build net35 se saltará"
          }
          Write-Host "Reference assemblies 4.8:"
          if (Test-Path "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8") {
            Write-Host "  OK 4.8"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: Restaurar paquetes
        working-directory: src/managed
        run: nuget restore FusionHP.Managed.sln

      - name: Build net48 (SDK-style + WindowsDesktop SDK)
        working-directory: src/managed
        run: msbuild FusionHP.Managed.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:minimal

      - name: Tests gestionados
        working-directory: src/managed
        run: |
          .\FusionHP.Managed.Tests\bin\Release\net48\FusionHP.Managed.Tests.exe

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: gestionada
          path: |
            src/managed/**/bin/Release/**
          retention-days: 14

  # ===========================================================================
  # Job 3: Build dual del Qt shell (x86 + x64) con Qt 5.15.2
  # ===========================================================================
  qt_shell:
    name: Qt 5.15.2 shell dual
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arquitectura: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arquitectura }}

      - name: Caché de Qt 5.15.2
        id: cache_qt
        uses: actions/cache@v4
        with:
          path: C:\Qt\5.15.2
          key: qt-5.15.2-${{ matrix.arquitectura == 'x86' && 'win32_msvc2019' || 'win64_msvc2019_64' }}

      # aqtinstall falla de forma esporádica al extraer un 7z corrupto
      # (Bad7zFile) cuando el espejo entrega un paquete truncado. Mitigación:
      # 3 intentos alternando espejos oficiales de Qt, con limpieza previa.
      - name: Instalar Qt 5.15.2
        if: steps.cache_qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          pip install aqtinstall
          $arch = if ("${{ matrix.arquitectura }}" -eq "x86") { "win32_msvc2019" } else { "win64_msvc2019_64" }
          $espejos = @("", "https://download.qt.io/", "https://mirrors.ocf.berkeley.edu/qt/")
          $ok = $false
          foreach ($espejo in $espejos) {
            for ($intento = 1; $intento -le 2; $intento++) {
              Write-Host "== aqt install-qt $arch (espejo: '$espejo', intento $intento) =="
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\Qt\5.15.2"
              if ([string]::IsNullOrEmpty($espejo)) {
                aqt install-qt windows desktop 5.15.2 $arch -O C:\Qt
              } else {
                aqt install-qt windows desktop 5.15.2 $arch -O C:\Qt -b $espejo
              }
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds 10
            }
            if ($ok) { break }
          }
          if (-not $ok) {
            Write-Host "##[error]Instalación de Qt 5.15.2 falló tras 6 intentos"
            exit 1
          }

      - name: Configurar CMake (qt-shell)
        working-directory: src/qt-shell
        env:
          CMAKE_PREFIX_PATH: ${{ matrix.arquitectura == 'x86' && 'C:\Qt\5.15.2\msvc2019' || 'C:\Qt\5.15.2\msvc2019_64' }}
        run: |
          cmake -S . -B build-${{ matrix.arquitectura }} -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Compilar Qt shell
        working-directory: src/qt-shell
        run: cmake --build build-${{ matrix.arquitectura }} --parallel

      # Desplegar las DLL de Qt junto al exe: el artefacto sale completo
      # para el portable y el instalador (build/empaquetar.ps1).
      - name: Desplegar Qt (windeployqt)
        shell: pwsh
        run: |
          $qtbin = if ("${{ matrix.arquitectura }}" -eq "x86") { "C:\Qt\5.15.2\msvc2019\bin" } else { "C:\Qt\5.15.2\msvc2019_64\bin" }
          & "$qtbin\windeployqt.exe" --release --no-translations --no-compiler-runtime --no-opengl-sw "src\qt-shell\build-${{ matrix.arquitectura }}\FusionQtShell.exe"
          if ($LASTEXITCODE -ne 0) { Write-Host "##[error]windeployqt falló"; exit 1 }
          Get-ChildItem "src\qt-shell\build-${{ matrix.arquitectura }}" | Select-Object -ExpandProperty Name

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: qt-shell-${{ matrix.arquitectura }}
          path: src/qt-shell/build-${{ matrix.arquitectura }}/*
          retention-days: 14

  # ===========================================================================
  # Job 4: Launcher C++17 (x86, sin consola)
  # ===========================================================================
  launcher:
    name: Launcher nativo
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configurar CMake (launcher)
        working-directory: src/launcher
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_PROCESSOR=x86

      - name: Compilar launcher
        working-directory: src/launcher
        run: cmake --build build --parallel

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: src/launcher/build/bin/*
          retention-days: 14

  # ===========================================================================
  # Job 5: Gate de calidad (corre solo si los 4 builds anteriores pasan)
  # ===========================================================================
  gate:
    name: Gate de calidad
    runs-on: windows-2022
    needs: [nucleo, gestionada, qt_shell, launcher]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: build/artifacts

      - name: Verificar restricciones (sin Registro, sin red, sin .cmd/.bat)
        shell: pwsh
        run: |
          .\build\quality_gate.ps1 -FromArtifacts

      - name: Subir reporte del gate
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: build/artifacts/gate_report.json

  # ===========================================================================
  # Job 6: Portable dual (un .zip autocontenido por arquitectura)
  # ===========================================================================
  portable:
    name: Portable ${{ matrix.arquitectura }}
    runs-on: windows-2022
    needs: [gate]
    strategy:
      fail-fast: false
      matrix:
        arquitectura: [x86, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar artefactos necesarios
        uses: actions/download-artifact@v4
        with:
          path: build/artifacts

      - name: Montar el árbol portable
        shell: pwsh
        run: |
          .\build\empaquetar.ps1 -Arch ${{ matrix.arquitectura }} `
            -Artefactos build\artifacts `
            -Destino build\portable\FUSION-HP

      - name: Comprimir el portable
        shell: pwsh
        run: |
          Compress-Archive -Path build\portable\FUSION-HP\* `
            -DestinationPath build\FUSION-HP-portable-${{ matrix.arquitectura }}.zip
          Get-Item build\FUSION-HP-portable-*.zip | Select-Object Name, Length

      - name: Subir portable
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arquitectura }}
          path: build/FUSION-HP-portable-${{ matrix.arquitectura }}.zip
          retention-days: 30

  # ===========================================================================
  # Job 7: Instaladores Inno Setup dual (en cada push; el árbol lo monta
  # el mismo empaquetar.ps1 que el portable — una sola fuente de verdad)
  # ===========================================================================
  instaladores:
    name: Instaladores dual (Inno Setup)
    runs-on: windows-2022
    needs: [gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: build/artifacts

      - name: Montar los árboles de paquete (x86 y x64)
        shell: pwsh
        run: |
          .\build\empaquetar.ps1 -Arch x86 `
            -Artefactos build\artifacts -Destino build\paquete\x86
          .\build\empaquetar.ps1 -Arch x64 `
            -Artefactos build\artifacts -Destino build\paquete\x64

      - name: Inno Setup (x86)
        shell: pwsh
        run: |
          $paq = (Resolve-Path "build\paquete\x86").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DARCH=x86 "/DPACKAGE=$paq" installer\FusionHP.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Inno Setup (x64)
        shell: pwsh
        run: |
          $paq = (Resolve-Path "build\paquete\x64").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DARCH=x64 "/DPACKAGE=$paq" installer\FusionHP.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Subir instaladores
        uses: actions/upload-artifact@v4
        with:
          name: instaladores
          path: |
            installer/Output/FusionHP-Setup-x86.exe
            installer/Output/FusionHP-Setup-x64.exe
          retention-days: 30

  # ===========================================================================
  # Job 8: Release (solo en tag v*): adjunta instaladores y portables
  # ===========================================================================
  release:
    name: Publicar release
    runs-on: windows-2022
    needs: [instaladores, portable]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Descargar instaladores y portables
        uses: actions/download-artifact@v4
        with:
          path: build/publicar

      - name: Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/publicar/instaladores/FusionHP-Setup-x86.exe
            build/publicar/instaladores/FusionHP-Setup-x64.exe
            build/publicar/portable-x86/FUSION-HP-portable-x86.zip
            build/publicar/portable-x64/FUSION-HP-portable-x64.zip
          draft: true
          name: ${{ github.ref_name }}
          generate_release_notes: true
